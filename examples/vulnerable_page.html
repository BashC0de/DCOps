<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Vulnerable Demo</title>
  </head>
  <body>
    <h1>Vulnerable Demo Page</h1>
    <form action="/echo" method="get">
      <label for="input">Say something:</label>
      <input id="input" name="q" />
      <button type="submit">Submit</button>
    </form>

    <!-- Reflected XSS: server will echo this value without encoding -->
    <div id="result"></div>

    <script>
      // Simple client-side fetch to the existing Flask demo if present
      async function fetchEcho() {
        const params = new URLSearchParams(window.location.search);
        const q = params.get('q');
        if (!q) return;
        // Directly insert user-controlled content (simulates vulnerable rendering)
        document.getElementById('result').innerHTML = '<h2>You said: ' + q + '</h2>';
      }
      fetchEcho();
      
      // Unsafe DOM manipulation from hash fragment
      const fragment = window.location.hash.slice(1);
      if (fragment) {
        const payload = document.createElement('div');
        payload.innerHTML = fragment;
        document.body.appendChild(payload);
      }
    </script>
  </body>
</html>
